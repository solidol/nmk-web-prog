<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title"><title id="title">Три джерела вхідних даних PHP</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#24578a"/></marker></defs><rect width="960" height="450" rx="16" fill="#f5f8fc"/><g font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18324d"><rect x="25" y="40" width="355" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="202.5" y="77">Параметри URL</text><rect x="580" y="40" width="355" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="757.5" y="77">$_GET</text><path d="M380 70H575" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><rect x="25" y="160" width="355" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="202.5" y="197">Поля POST-форми</text><rect x="580" y="160" width="355" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="757.5" y="197">$_POST; файли — $_FILES</text><path d="M380 190H575" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><rect x="25" y="280" width="355" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="202.5" y="317">Тіло application/json</text><rect x="580" y="280" width="355" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="757.5" y="317">php://input → json_decode</text><path d="M380 310H575" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><text x="480" y="400">Метод визначають окремо: $_SERVER[REQUEST_METHOD]</text></g></svg>
