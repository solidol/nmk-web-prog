<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title"><title id="title">Різні завдання захисту вебзастосунку</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#24578a"/></marker></defs><rect width="960" height="490" rx="16" fill="#f5f8fc"/><g font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18324d"><rect x="25" y="30" width="350" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="200" y="67">Валідація</text><rect x="580" y="30" width="355" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="757.5" y="67">Тип, формат, допустимі межі</text><rect x="25" y="130" width="350" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="200" y="167">Авторизація та CSRF</text><rect x="580" y="130" width="355" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="757.5" y="167">Право на дію; захист запиту</text><rect x="25" y="230" width="350" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="200" y="267">Параметризований SQL</text><rect x="580" y="230" width="355" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="757.5" y="267">Дані окремо від SQL-коду</text><rect x="25" y="330" width="350" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="200" y="367">HTML-екранування</text><rect x="580" y="330" width="355" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="757.5" y="367">Текст не стає HTML-кодом</text><path d="M375 60H575" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><path d="M375 160H575" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><path d="M375 260H575" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><path d="M375 360H575" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><text x="480" y="450">Це різні завдання, а не взаємозамінні способи захисту</text></g></svg>
