<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title"><title id="title">Цикл do while: перевірка після тіла</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#24578a"/></marker></defs><rect width="960" height="600" rx="16" fill="#f5f8fc"/><g font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18324d"><rect x="260" y="20" width="300" height="60" rx="30" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="410" y="57">number = 12</text><rect x="260" y="130" width="300" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="410" y="167">Вивести number</text><rect x="260" y="240" width="300" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="410" y="277">number += 2</text><path d="M410 365l150 55 -150 55 -150 -55Z" fill="#fff0d7" stroke="#99732d" stroke-width="2"/><text x="410" y="427">number &lt;= 6?</text><rect x="700" y="390" width="200" height="60" rx="30" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="800" y="427">Кінець</text><path d="M410 80V125" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><path d="M410 190V235" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><path d="M410 300V360" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><path d="M260 420H120V160H255" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><path d="M560 420H695" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><text x="195" y="406">Так</text><text x="630" y="406">Ні</text></g></svg>
