<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title"><title id="title">Підсумовування кількості через foreach</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#24578a"/></marker></defs><rect width="960" height="600" rx="16" fill="#f5f8fc"/><g font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18324d"><rect x="250" y="20" width="340" height="60" rx="30" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="420" y="57">total = 0; почати обхід</text><path d="M420 140l150 55 -150 55 -150 -55Z" fill="#fff0d7" stroke="#99732d" stroke-width="2"/><text x="420" y="202">Є наступний елемент?</text><rect x="250" y="315" width="340" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="420" y="352">Отримати code і quantity</text><rect x="250" y="425" width="340" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="420" y="462">total += quantity</text><rect x="700" y="165" width="230" height="60" rx="30" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="815" y="202">Вивести total</text><path d="M420 80V135" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><path d="M420 250V310" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><path d="M420 375V420" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><path d="M250 455H110V195H265" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><path d="M570 195H695" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><text x="450" y="283">Так</text><text x="635" y="181">Ні</text></g></svg>
