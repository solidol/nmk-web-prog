<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title"><title id="title">Відмінність значення і посилання для цілого числа</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#24578a"/></marker></defs><rect width="960" height="400" rx="16" fill="#f5f8fc"/><g font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18324d"><text x="480" y="40">Два незалежні виклики: зовнішня змінна спочатку дорівнює 10</text><rect x="30" y="100" width="270" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="165" y="137">Параметр $value</text><rect x="345" y="100" width="270" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="480" y="137">$value += 5</text><rect x="660" y="100" width="270" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="795" y="137">Зовні лишається 10</text><path d="M300 130H340" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><path d="M615 130H655" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><rect x="30" y="250" width="270" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="165" y="287">Параметр &amp;$value</text><rect x="345" y="250" width="270" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="480" y="287">$value += 5</text><rect x="660" y="250" width="270" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="795" y="287">Зовні стає 15</text><path d="M300 280H340" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><path d="M615 280H655" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><text x="480" y="365">&amp; зв’язує параметр зі змінною виклику</text></g></svg>
