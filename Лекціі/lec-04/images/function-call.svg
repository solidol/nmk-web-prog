<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title"><title id="title">Аргументи, параметри й результат функції</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#24578a"/></marker></defs><rect width="960" height="380" rx="16" fill="#f5f8fc"/><g font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18324d"><rect x="30" y="80" width="340" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="200" y="117">calculateTotal(120, 3)</text><rect x="560" y="80" width="360" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="740" y="117">price = 120; quantity = 3</text><rect x="560" y="200" width="360" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="740" y="237">return price * quantity</text><rect x="30" y="200" width="340" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="200" y="237">total = 360</text><path d="M370 110H555" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><path d="M740 140V195" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><path d="M560 230H375" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><text x="460" y="96">Виклик</text><text x="460" y="216">Результат</text><text x="480" y="335">return завершує функцію; виконання триває після виклику</text></g></svg>
