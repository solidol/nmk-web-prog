<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title"><title id="title">Рекурсія sumTo з базовим випадком</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#24578a"/></marker></defs><rect width="960" height="600" rx="16" fill="#f5f8fc"/><g font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#18324d"><rect x="330" y="20" width="300" height="60" rx="30" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="480" y="57">Виклик sumTo(n)</text><path d="M480 135l150 55 -150 55 -150 -55Z" fill="#fff0d7" stroke="#99732d" stroke-width="2"/><text x="480" y="197">n === 0?</text><rect x="40" y="320" width="320" height="60" rx="30" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="200" y="357">return 0</text><rect x="570" y="320" width="350" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="745" y="357">r = sumTo(n - 1)</text><rect x="570" y="450" width="350" height="60" rx="30" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="745" y="487">return n + r</text><path d="M480 80V130" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><path d="M330 190H200V315" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><path d="M630 190H745V315" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><path d="M745 380V445" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><text x="250" y="176">Так</text><text x="695" y="176">Ні</text><text x="480" y="570">Передумова: невелике невід’ємне ціле n</text></g></svg>
