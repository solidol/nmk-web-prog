<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
  <title id="title">Формування динамічного каталогу</title>
  <desc id="desc">Запит проходить від браузера через Nginx до PHP і Laravel. Застосунок звертається до MariaDB. Записи повертаються застосунку, який формує відповідь для браузера.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#24578a"/></marker></defs>
  <rect width="960" height="350" rx="16" fill="#f5f8fc"/>
  <g font-family="Arial, sans-serif" fill="#18324d" text-anchor="middle">
    <text x="480" y="38" font-size="22" font-weight="bold">Запит → оброблення → отримання даних</text>
    <g fill="#e0edfc" stroke="#24578a" stroke-width="2">
      <rect x="20" y="114" width="160" height="104" rx="12"/>
      <rect x="270" y="114" width="160" height="104" rx="12"/>
      <rect x="520" y="114" width="170" height="104" rx="12"/>
      <rect x="780" y="114" width="160" height="104" rx="12" fill="#e3f2ec" stroke="#28735a"/>
    </g>
    <g font-size="23" font-weight="bold">
      <text x="100" y="173">Браузер</text><text x="350" y="173">Nginx</text>
      <text x="605" y="155">PHP /</text><text x="605" y="185">Laravel</text>
      <text x="860" y="173">MariaDB</text>
    </g>
    <g fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M 100 114 V 80 H 350 V 108"/><path d="M 350 114 V 80 H 605 V 108"/><path d="M 605 114 V 80 H 860 V 108"/>
      <path d="M 860 218 V 257 H 605 V 224"/><path d="M 605 218 V 257 H 350 V 224"/><path d="M 350 218 V 257 H 100 V 224"/>
    </g>
    <g font-size="18">
      <text x="220" y="70">HTTP</text><text x="478" y="70">FastCGI</text><text x="737" y="70">SQL-запит</text>
      <text x="220" y="283">HTML через HTTP</text><text x="478" y="283">Готова відповідь</text><text x="737" y="283">Записи</text>
    </g>
    <text x="480" y="327" font-size="19">PHP перевіряє параметри та формує HTML із отриманих даних</text>
  </g>
</svg>
