<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Цикл обміну між браузером і вебсервером</title>
  <desc id="desc">Браузер надсилає HTTP-запит, вебсервер повертає відповідь. Браузер будує сторінку та запитує додаткові ресурси.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#24578a"/></marker></defs>
  <rect width="960" height="300" rx="16" fill="#f5f8fc"/>
  <g font-family="Arial, sans-serif" fill="#18324d" text-anchor="middle">
    <rect x="30" y="60" width="190" height="130" rx="12" fill="#e0edfc" stroke="#24578a" stroke-width="2"/>
    <text x="125" y="130" font-size="26" font-weight="bold">Браузер</text>
    <rect x="740" y="60" width="190" height="130" rx="12" fill="#e3f2ec" stroke="#28735a" stroke-width="2"/>
    <text x="835" y="130" font-size="26" font-weight="bold">Вебсервер</text>
    <text x="480" y="64" font-size="22" font-weight="bold">HTTP-запит</text>
    <text x="480" y="90" font-size="18">Метод, адреса, заголовки, за потреби тіло</text>
    <path d="M 235 108 H 725" fill="none" stroke="#24578a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 725 152 H 235" fill="none" stroke="#24578a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="480" y="181" font-size="22" font-weight="bold">HTTP-відповідь</text>
    <text x="480" y="207" font-size="18">Статус, заголовки, за потреби тіло</text>
    <text x="480" y="267" font-size="20">Далі браузер будує сторінку й запитує CSS, JS та зображення</text>
  </g>
</svg>
