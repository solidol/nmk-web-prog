<svg xmlns="http://www.w3.org/2000/svg" width="960" height="920" viewBox="0 0 960 920" role="img" aria-labelledby="title"><title id="title">Послідовні перевірки до збереження</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#24578a"/></marker></defs><rect width="960" height="920" rx="16" fill="#f5f8fc"/><g font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#18324d"><rect x="160" y="15" width="340" height="60" rx="30" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="330" y="52">Отримано запит</text><path d="M330 110l155 55 -155 55 -155 -55Z" fill="#fff0d7" stroke="#99732d" stroke-width="2"/><text x="330" y="172">POST і CSRF коректні?</text><rect x="660" y="135" width="270" height="60" rx="30" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="795" y="172">405 або 403</text><path d="M485 165H655" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><text x="565" y="151">Ні</text><path d="M330 75V105" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><path d="M330 220V265" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><text x="360" y="250">Так</text><path d="M330 270l155 55 -155 55 -155 -55Z" fill="#fff0d7" stroke="#99732d" stroke-width="2"/><text x="330" y="332">Файл отримано повністю?</text><rect x="660" y="295" width="270" height="60" rx="30" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="795" y="332">400: помилка файла</text><path d="M485 325H655" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><text x="565" y="311">Ні</text><path d="M330 380V425" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><text x="360" y="410">Так</text><path d="M330 430l155 55 -155 55 -155 -55Z" fill="#fff0d7" stroke="#99732d" stroke-width="2"/><text x="330" y="492">Розмір 1 байт – 2 MiB?</text><rect x="660" y="455" width="270" height="60" rx="30" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="795" y="492">413: розмір</text><path d="M485 485H655" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><text x="565" y="471">Ні</text><path d="M330 540V585" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><text x="360" y="570">Так</text><path d="M330 590l155 55 -155 55 -155 -55Z" fill="#fff0d7" stroke="#99732d" stroke-width="2"/><text x="330" y="652">MIME: application/pdf?</text><rect x="660" y="615" width="270" height="60" rx="30" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="795" y="652">415: тип</text><path d="M485 645H655" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><text x="565" y="631">Ні</text><rect x="150" y="770" width="360" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="330" y="807">Випадкове ім’я; переміщення</text><path d="M330 700V765" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><text x="365" y="738">Так</text><text x="480" y="885">Успіх переміщення → 201; помилка сховища → 500</text></g></svg>
