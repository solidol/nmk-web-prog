<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title"><title id="title">Від навчальних даних до PNG</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#24578a"/></marker></defs><rect width="960" height="440" rx="16" fill="#f5f8fc"/><g font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#18324d"><rect x="25" y="60" width="270" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="160" y="97">Значення: 40, 80, 120</text><rect x="345" y="60" width="270" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="480" y="97">GD: полотно 320 × 180</text><rect x="665" y="60" width="270" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="800" y="97">Фон і прямокутники</text><rect x="665" y="240" width="270" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="800" y="277">Content-Type: image/png</text><rect x="345" y="240" width="270" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="480" y="277">imagepng(): байти PNG</text><rect x="25" y="240" width="270" height="60" rx="8" fill="#e0edfc" stroke="#24578a" stroke-width="2"/><text x="160" y="277">Браузер: елемент img</text><path d="M295 90H340" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><path d="M615 90H660" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><path d="M800 120V235" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><path d="M665 270H620" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><path d="M345 270H300" fill="none" stroke="#24578a" stroke-width="2.5" marker-end="url(#a)"/><text x="480" y="390">PNG — окрема відповідь, без HTML і діагностичного тексту</text></g></svg>
